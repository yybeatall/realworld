<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访客签到系统</title>
    <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Microsoft Yahei', sans-serif;
    }
    
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: #f5f5f5;
    }
    
    .page {
      display: none;
      width: 100%;
      height: 100%;
      padding: 50px;
    }
    
    .active {
      display: block !important;
    }
    
    /* 待机页面 */
    #standbyPage {
      background-image: url('/public/background.svg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .logo {
      width: 300px;
      height: 300px;
      margin-bottom: 50px;
    }
    
    .welcome-message {
      font-size: 48px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      margin-bottom: 100px;
    }
    
    .checkin-btn {
      padding: 20px 50px;
      font-size: 36px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .checkin-btn:hover {
      background-color: #0056b3;
    }
    
    /* 验证页面 */
    #verificationPage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .verification-container {
      background-color: #fff;
      padding: 80px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
    }
    
    .verification-container h2 {
      font-size: 36px;
      color: #333;
      margin-bottom: 50px;
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 30px;
    }
    
    .form-group label {
      display: block;
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }
    
    .form-group input {
      width: 400px;
      padding: 15px;
      font-size: 24px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    
    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 50px;
    }
    
    .btn-group button {
      padding: 15px 30px;
      font-size: 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .back-btn {
      background-color: #6c757d;
      color: #fff;
    }
    
    .back-btn:hover {
      background-color: #5a6268;
    }
    
    .verify-btn {
      background-color: #28a745;
      color: #fff;
    }
    
    .verify-btn:hover {
      background-color: #218838;
    }
    
    /* 人证比对页面 */
    #faceVerificationPage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .face-container {
      background-color: #fff;
      padding: 80px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    
    .face-container h2 {
      font-size: 36px;
      color: #333;
      margin-bottom: 30px;
    }
    
    .face-tips {
      font-size: 24px;
      color: #666;
      margin-bottom: 50px;
    }
    
    .face-capture-area {
      width: 600px;
      height: 400px;
      border: 2px dashed #ccc;
      border-radius: 10px;
      margin: 0 auto 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: #999;
    }
    
    .face-capture-btn {
      padding: 15px 30px;
      font-size: 24px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .face-capture-btn:hover {
      background-color: #0056b3;
    }
    
    /* 确认页 */
    #confirmationPage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .confirmation-container {
      background-color: #fff;
      padding: 80px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    
    .confirmation-container h2 {
      font-size: 36px;
      color: #333;
      margin-bottom: 30px;
    }
    
    .visitor-info {
      font-size: 24px;
      color: #333;
      margin-bottom: 50px;
      text-align: left;
    }
    
    .visitor-info p {
      margin-bottom: 10px;
    }
    
    .confirm-btn {
      padding: 15px 30px;
      font-size: 24px;
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-right: 20px;
    }
    
    .confirm-btn:hover {
      background-color: #218838;
    }
    
    /* 打印页面 */
    #printPage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .print-container {
      background-color: #fff;
      padding: 80px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    
    .print-container h2 {
      font-size: 36px;
      color: #333;
      margin-bottom: 30px;
    }
    
    .print-tips {
      font-size: 24px;
      color: #666;
      margin-bottom: 50px;
    }
    
    .print-btn {
      padding: 15px 30px;
      font-size: 24px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .print-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <!-- 待机页面 -->
  <div id="standbyPage" class="page active">
    <img src="/public/logo.svg" alt="企业Logo" class="logo">
    <h1 class="welcome-message">欢迎光临XX公司</h1>
    <button class="checkin-btn" onclick="goToVerification()">点击签到</button>
  </div>

  <!-- 验证页面 -->
  <div id="verificationPage" class="page">
    <div class="verification-container">
      <h2>访客签到</h2>
      <div class="form-group">
        <label for="phone">手机号:</label>
        <input type="tel" id="phone" placeholder="请输入手机号">
      </div>
      <div class="form-group">
        <label for="idCard">身份证号:</label>
        <input type="text" id="idCard" placeholder="请输入身份证号">
      </div>
      <div class="btn-group">
        <button class="back-btn" onclick="goToStandby()">返回</button>
        <button class="verify-btn" onclick="verifyVisitor()">验证</button>
      </div>
    </div>
  </div>

  <!-- 人证比对页面 -->
  <div id="faceVerificationPage" class="page">
    <div class="face-container">
      <h2>人证比对</h2>
      <p class="face-tips">请将面部对准摄像头，保持光线充足</p>
      <div class="face-capture-area">
        <span>摄像头采集区域</span>
      </div>
      <button class="face-capture-btn" onclick="captureFace()">开始比对</button>
    </div>
  </div>

  <!-- 确认页 -->
  <div id="confirmationPage" class="page">
    <div class="confirmation-container">
      <h2>签到确认</h2>
      <div class="visitor-info">
        <p><strong>姓名:</strong> 张三</p>
        <p><strong>手机号:</strong> 13800138000</p>
        <p><strong>身份证号:</strong> 110101199001011234</p>
        <p><strong>来访时间:</strong> 2025-11-28 14:30</p>
        <p><strong>来访楼层:</strong> 5楼</p>
        <p><strong>接待人:</strong> 李四 (工号: 12345)</p>
      </div>
      <button class="confirm-btn" onclick="goToPrint()">确认并打印访客证</button>
      <button class="back-btn" onclick="goToVerification()">返回</button>
    </div>
  </div>

  <!-- 打印页面 -->
  <div id="printPage" class="page">
    <div class="print-container">
      <h2>打印访客证</h2>
      <p class="print-tips">正在打印访客证，请稍候...</p>
      <button class="print-btn" onclick="completePrint()">打印完成</button>
    </div>
  </div>

  <script>
    // 页面切换函数
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });
      document.getElementById(pageId).classList.add('active');
    }

    function goToStandby() {
      showPage('standbyPage');
    }

    function goToVerification() {
      showPage('verificationPage');
    }

    function goToFaceVerification() {
      showPage('faceVerificationPage');
    }

    function goToConfirmation() {
      showPage('confirmationPage');
    }

    function goToPrint() {
      showPage('printPage');
    }

    function completePrint() {
      alert('访客证打印完成，祝您来访愉快!');
      goToStandby();
    }

    // 验证访客信息
    function verifyVisitor() {
      const phone = document.getElementById('phone').value;
      const idCard = document.getElementById('idCard').value;

      if (!phone && !idCard) {
        alert('请输入手机号或身份证号');
        return;
      }

      // 模拟验证成功
      console.log('验证访客信息:', { phone, idCard });
      goToFaceVerification();
    }

    // 采集面部信息（模拟）
    function captureFace() {
      // 模拟面部比对成功
      console.log('正在进行人证比对...');
      setTimeout(() => {
        console.log('人证比对成功!');
        goToConfirmation();
      }, 2000);
    }
  </script>
</body>
</html>
